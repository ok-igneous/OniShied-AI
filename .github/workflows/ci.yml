name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep a single validation run per branch; newer commits supersede queued runs.
concurrency:
  group: onishield-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Provision isolated test database and verify tenant RLS
        env:
          PGPASSWORD: postgres
        run: |
          MIGRATOR_DB_PASSWORD="$(openssl rand -hex 32)"
          APP_DB_PASSWORD="$(openssl rand -hex 32)"
          AUTH_DB_PASSWORD="$(openssl rand -hex 32)"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v migrator_password="$MIGRATOR_DB_PASSWORD" \
            -v app_password="$APP_DB_PASSWORD" \
            -v auth_password="$AUTH_DB_PASSWORD" \
            -f database/bootstrap-roles.sql
          PGPASSWORD="$MIGRATOR_DB_PASSWORD" psql -h 127.0.0.1 \
            -U onishield_migrator -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/apply-migrations.sql
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/tenant_rls_smoke.sql
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/threat_intelligence_rls_smoke.sql
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/detection_findings_rls_smoke.sql
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/finding_threat_intel_smoke.sql

      - name: Verify threat-intelligence reviewer controls
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/threat_indicator_review_smoke.sql

      - name: Verify operator identity tenant and privilege controls
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/operator_identity_smoke.sql

      - name: Verify authentication throttling and operator-attributed review audit
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/operator_auth_security_smoke.sql

      - name: Verify operator invitation and email lifecycle controls
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d onishield_lab \
            -v ON_ERROR_STOP=1 -f database/tests/operator_email_lifecycle_smoke.sql

      - name: Enforce source-file size limit
        run: npm run check:lines

      - name: Run schema tests
        run: npm test

      - name: Test backup encryption, connection mapping, and uploader syntax
        run: |
          npm run test:backup
          node --check scripts/backup-postgres.mjs
          node --check scripts/backup-s3.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
